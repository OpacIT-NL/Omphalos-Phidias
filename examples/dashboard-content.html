<!--
  Dashboard GUI/layout shell. Place this below the existing gui.html header.

  Load each component with Get Template, fill its data variables, then insert
  it here with Apply Variable. Remove "dashboard-" from the filename and
  replace its hyphens with underscores to get the placeholder name.
-->
<main class="iris-dashboard" aria-label="Operations dashboard">
  %sidebar%

  <div class="iris-dashboard__content">
    %heading%

    <section class="iris-metrics" aria-label="Key metrics">
      %metric_availability%
      %metric_active_systems%
      %metric_open_incidents%
      %metric_storage%
    </section>

    <section class="iris-dashboard__grid">
      %panel_request_volume%

      %panel_capacity%

      %panel_service_health%

      %panel_recent_activity%
    </section>
  </div>
</main>
