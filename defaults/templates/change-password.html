<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%app_name% &middot; Change password</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>%login_css%</style>
</head>
<body>
  <main class="auth-card auth-card--password">
    <div class="auth-brand">
      <span class="auth-mark">P</span>
      <span>
        <strong>OpacIT Omphalos</strong>
        <small>Phidias &middot; %app_name%</small>
      </span>
    </div>
    <h1>Change password</h1>
    <p class="auth-error" role="alert">%error%</p>
    <form method="post" action="%action%">
      <label class="auth-field">
        Username
        <input name="username" value="%username%" autocomplete="username" minlength="3" maxlength="64" required autofocus>
      </label>
      <label class="auth-field">
        Current password
        <input name="current_password" type="password" autocomplete="current-password" required>
      </label>
      <label class="auth-field">
        New password
        <input name="new_password" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <label class="auth-field">
        Confirm new password
        <input name="confirm_new_password" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <button type="submit">Change password</button>
    </form>
  </main>
</body>
</html>
