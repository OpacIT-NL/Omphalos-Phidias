name: Release Phidias

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Stamp tag version and build release ZIP and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-release.js "$RELEASE_TAG"

      - name: Build release description from commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.draft == false and .tag_name != \"$RELEASE_TAG\")][0].tag_name // empty")"
          node scripts/generate-release-notes.js "$RELEASE_TAG" "$previous_tag" dist/release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/amp-release.zip dist/amp-release.zip.sha256 --clobber
            gh release edit "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/amp-release.zip dist/amp-release.zip.sha256 \
              --verify-tag \
              --notes-file dist/release-notes.md
          fi
